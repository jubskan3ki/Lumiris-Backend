spring:
  application:
    name: lumiris-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB

  flyway:
    enabled: true
    locations: classpath:db/migration


cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:3002,http://localhost:3003}

security:
  jwt:
    secret: ${JWT_SECRET:lumiris-secret-key-change-in-production-min-256-bits}
    expiration: 86400000

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}

blockchain:
  rpc-url: ${BLOCKCHAIN_RPC_URL}
  wallet:
    private-key: ${BLOCKCHAIN_WALLET_PRIVATE_KEY}

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false
